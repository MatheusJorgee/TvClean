<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Arial, Helvetica, sans-serif">
  <title>TvClean: wireframe da barra de apps sobre um app aberto (1920x1080, mesmas medidas do launcher)</title>
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CBD2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C6CBD2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#B8BEC6" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- O app aberto continua rodando atrás da barra -->
  <rect x="0" y="0" width="1920" height="1080" fill="#EEF0F3"/>
  <line x1="0" y1="0" x2="1920" y2="1080" stroke="#C9CDD3" stroke-width="3" stroke-dasharray="14 10"/>
  <line x1="1920" y1="0" x2="0" y2="1080" stroke="#C9CDD3" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="960" y="380" font-size="30" fill="#80868B" text-anchor="middle">App aberto (continua rodando por trás)</text>

  <!-- Janela da barra: 380 de altura, presa embaixo -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#veil)"/>
  <text x="96" y="876" font-size="26" font-weight="bold" fill="#202124">Seus apps</text>
  <text x="1824" y="876" font-size="20" fill="#3C4043" text-anchor="end">Casinha de novo: Início   ·   Voltar: fechar</text>

  <!-- Blocos 260x146, espaço 24; o app aberto começa em foco -->
  <g font-size="24" text-anchor="middle">
    <rect x="96" y="906" width="260" height="146" rx="18" fill="#3C4043"/>
    <text x="226" y="987" font-weight="bold" fill="#FFFFFF">Início</text>

    <rect x="380" y="906" width="260" height="146" rx="18" fill="#E8EAED" stroke="#9AA0A6" stroke-width="2"/>
    <text x="510" y="987" fill="#5F6368">App</text>

    <rect x="651" y="899" width="286" height="161" rx="20" fill="#E8EAED" stroke="#202124" stroke-width="6"/>
    <text x="794" y="979" fill="#202124">App aberto</text>
    <text x="794" y="1010" font-size="18" fill="#5F6368">(foco inicial)</text>

    <rect x="948" y="906" width="260" height="146" rx="18" fill="#E8EAED" stroke="#9AA0A6" stroke-width="2"/>
    <text x="1078" y="987" fill="#5F6368">App</text>
    <rect x="1232" y="906" width="260" height="146" rx="18" fill="#E8EAED" stroke="#9AA0A6" stroke-width="2"/>
    <text x="1362" y="987" fill="#5F6368">App</text>
    <rect x="1516" y="906" width="260" height="146" rx="18" fill="#E8EAED" stroke="#9AA0A6" stroke-width="2"/>
    <text x="1646" y="987" fill="#5F6368">App</text>
    <rect x="1800" y="906" width="260" height="146" rx="18" fill="#E8EAED" stroke="#9AA0A6" stroke-width="2"/>
  </g>

  <rect x="2" y="2" width="1916" height="1076" fill="none" stroke="#5F6368" stroke-width="4"/>
</svg>
